<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英検準2級 単語バトル</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F4; --card:#FFFFFF; --ink:#26323C; --sub:#6B7A85; --line:#E4E2D8;
  --green:#149A6B; --green-bg:#E3F5EC; --green-dk:#0A6B49;
  --coral:#E15A3C; --coral-bg:#FCEAE4; --coral-dk:#9C3A22;
  --blue:#2E7CC4; --blue-bg:#E7F1FA; --blue-dk:#1A517F;
  --amber:#F0A31F; --amber-bg:#FCF1D8; --amber-dk:#8A5B08;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",sans-serif;line-height:1.6;min-height:100vh;}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px;}
h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;}
h1 .en{font-family:"Outfit",sans-serif;font-size:13px;font-weight:600;color:var(--green);background:var(--green-bg);padding:2px 10px;border-radius:99px;}
.sub{font-size:13px;color:var(--sub);margin-top:2px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:14px;}
button{font-family:inherit;font-size:15px;font-weight:500;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;cursor:pointer;transition:transform .06s,background .15s,border-color .15s;}
button:hover{border-color:var(--ink);}
button:active{transform:scale(.97);}
button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:700;}
button.primary:hover{background:var(--green-dk);border-color:var(--green-dk);}
.seg{display:flex;gap:8px;flex-wrap:wrap;}
.seg button{flex:1;min-width:100px;}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
label.fl{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 6px;}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.stat{background:var(--bg);border-radius:10px;padding:8px 6px;text-align:center;}
.stat b{display:block;font-size:20px;font-weight:700;}
.stat span{font-size:11px;color:var(--sub);}
.pbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px;}
.pbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s;}
.scorebar{display:flex;gap:10px;margin-top:14px;}
.pcard{flex:1;border-radius:var(--radius);padding:10px 14px;border:2px solid transparent;background:var(--card);border-color:var(--line);transition:all .2s;}
.pcard.active{border-color:var(--green);background:var(--green-bg);}
.pcard .nm{font-size:12px;color:var(--sub);font-weight:700;}
.pcard.active .nm{color:var(--green-dk);}
.pcard .sc{font-size:24px;font-weight:700;font-family:"Outfit",sans-serif;}
.pcard .st{font-size:11px;color:var(--amber-dk);font-weight:700;}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px;color:var(--sub);}
.qmeta .badge{background:var(--blue-bg);color:var(--blue-dk);font-weight:700;padding:1px 10px;border-radius:99px;font-size:12px;}
.qmeta .badge.re{background:var(--amber-bg);color:var(--amber-dk);}
.wordcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 18px 18px;text-align:center;margin-top:8px;}
.word{font-family:"Outfit",sans-serif;font-size:36px;font-weight:700;letter-spacing:.01em;line-height:1.2;}
.word.small{font-size:26px;}
.pos{font-size:12px;color:var(--sub);margin-top:4px;}
.boxdots{margin-top:10px;font-size:0;}
.boxdots i{display:inline-block;width:9px;height:9px;border-radius:99px;background:var(--line);margin:0 3px;}
.boxdots i.f{background:var(--green);}
.spk{margin-top:12px;font-size:14px;padding:8px 18px;border-radius:99px;}
.choices{display:grid;gap:10px;margin-top:14px;}
.choices button{text-align:left;font-size:16px;padding:13px 16px;}
.choices button.ok{background:var(--green-bg);border-color:var(--green);color:var(--green-dk);font-weight:700;}
.choices button.ng{background:var(--coral-bg);border-color:var(--coral);color:var(--coral-dk);font-weight:700;}
.choices button:disabled{cursor:default;}
.fb{min-height:30px;text-align:center;font-size:15px;font-weight:700;margin-top:12px;}
.fb.ok{color:var(--green-dk);}
.fb.ng{color:var(--coral-dk);}
.ctr{display:flex;justify-content:center;gap:10px;margin-top:10px;}
.rvrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px;}
.rvrow b{font-family:"Outfit",sans-serif;font-weight:600;}
.rvrow span{color:var(--sub);text-align:right;}
.rvrow .sbtn{font-size:12px;padding:3px 10px;border-radius:99px;flex-shrink:0;}
.hidden{display:none;}
.winner{text-align:center;padding:8px 0 4px;}
.winner .t{font-size:22px;font-weight:700;}
.winner .d{font-size:14px;color:var(--sub);}
.note{font-size:12px;color:var(--sub);margin-top:10px;}
.multbadge{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;padding:3px 16px;border-radius:99px;background:var(--amber-bg);color:var(--amber-dk);animation:pulse 1.1s infinite;}
.multbadge.final{background:var(--coral-bg);color:var(--coral-dk);}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.timerwrap{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px;}
.timerwrap i{display:block;height:100%;width:100%;background:var(--blue);border-radius:99px;}
.timerwrap i.low{background:var(--coral);}
.stealbox{background:var(--amber-bg);border:2px dashed var(--amber);border-radius:var(--radius);padding:10px 14px;margin-top:12px;text-align:center;font-weight:700;color:var(--amber-dk);animation:pulse 1.1s infinite;}
.stealbox button{margin-top:6px;font-size:13px;padding:5px 16px;border-radius:99px;background:#fff;}
.choices button.stealable{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-bg);}
.choices .ink{background:#232B36;color:transparent;border-radius:7px;padding:0 1px;}
.choices.deink .ink{background:transparent;color:inherit;transition:background .5s ease,color .5s ease;}
.scorebar{position:sticky;top:0;z-index:50;background:var(--bg);padding:8px 0 6px;box-shadow:0 6px 12px -8px rgba(38,50,60,.18);}
.pcard{position:relative;}
.scorepop{position:absolute;top:-8px;font-family:"Outfit",sans-serif;font-weight:700;font-size:20px;pointer-events:none;z-index:5;animation:popup 1.15s ease-out forwards;}
.scorepop.plus{color:var(--green-dk);text-shadow:0 0 12px rgba(20,154,107,.35);}
.scorepop.minus{color:var(--coral-dk);text-shadow:0 0 12px rgba(225,90,60,.35);}
.scorepop.big{font-size:32px;}
@keyframes popup{0%{transform:translateY(8px) scale(.5);opacity:0}14%{transform:translateY(0) scale(1.35);opacity:1}30%{transform:scale(1)}100%{transform:translateY(-40px) scale(1);opacity:0}}
.pcard.gain{animation:cardgain .55s ease-out;}
@keyframes cardgain{0%{box-shadow:0 0 0 0 rgba(20,154,107,.55)}100%{box-shadow:0 0 0 16px rgba(20,154,107,0)}}
.pcard.loss{animation:cardloss .5s ease-out;}
@keyframes cardloss{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px);box-shadow:0 0 0 4px var(--coral-bg)}35%{transform:translateX(6px)}55%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fxscore{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:"M PLUS Rounded 1c",sans-serif;font-weight:700;font-size:30px;white-space:nowrap;animation:fxslam 1.5s cubic-bezier(.2,1.3,.4,1) forwards;text-shadow:0 2px 0 #fff,0 4px 14px rgba(38,50,60,.25);}
.fxscore.plus{color:var(--green-dk);}
.fxscore.minus{color:var(--coral-dk);}
.fxscore.big{font-size:44px;}
@keyframes fxslam{0%{transform:translateX(-50%) scale(2.4);opacity:0}12%{transform:translateX(-50%) scale(1);opacity:1}55%{transform:translateX(-50%) translateY(0);opacity:1}100%{transform:translateX(-50%) translateY(-70px);opacity:0}}
.itembar{display:flex;gap:10px;margin-top:10px;}
.ichip{flex:1;display:flex;align-items:center;gap:7px;background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:6px 10px;font-size:12px;color:var(--sub);min-height:40px;}
.ichip.on{border-color:var(--amber);background:var(--amber-bg);}
.ichip .iic{font-size:20px;line-height:1;}
.ichip .ids{flex:1;line-height:1.3;}
.ichip button{font-size:12px;padding:4px 14px;border-radius:99px;background:var(--amber);border-color:var(--amber);color:#fff;font-weight:700;animation:pulse 1.1s infinite;}
.miraclebox{background:linear-gradient(135deg,var(--amber-bg),var(--coral-bg));border:2px solid var(--amber);border-radius:var(--radius);padding:12px 14px;margin-top:12px;text-align:center;font-size:14px;}
.miraclebox .mnote{font-size:12px;color:var(--sub);}
.miraclebox button{margin-top:8px;font-weight:700;background:var(--amber);border-color:var(--amber);color:#fff;font-size:15px;padding:9px 26px;animation:pulse 1.1s infinite;}
#sdfx{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#3a0d0d,#120404 75%);}
#sdfx.hidden{display:none;}
.sdflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:sdflash 1.3s .05s;}
@keyframes sdflash{0%{opacity:.95}7%{opacity:0}11%{opacity:.55}18%{opacity:0}26%{opacity:.25}32%{opacity:0}100%{opacity:0}}
.sdinner{text-align:center;color:#fff;animation:sdslam .55s cubic-bezier(.2,1.5,.35,1),sdquake .07s 10 alternate .6s;}
@keyframes sdslam{0%{transform:scale(3.2);opacity:0}55%{transform:scale(.93);opacity:1}100%{transform:scale(1)}}
@keyframes sdquake{from{transform:translate(-3px,1px)}to{transform:translate(3px,-1px)}}
.sdround{font-family:"Outfit",sans-serif;font-size:17px;font-weight:600;letter-spacing:.35em;color:#F0A31F;}
.sdtitle{font-family:"Outfit",sans-serif;font-size:62px;font-weight:700;line-height:.95;letter-spacing:.03em;color:#FF4D4D;text-shadow:0 0 24px rgba(255,77,77,.65),0 0 60px rgba(255,77,77,.35);margin-top:8px;}
.sdjp{margin-top:16px;font-size:15px;color:#ffd6d6;letter-spacing:.1em;animation:sdblink 1s infinite .7s;}
@keyframes sdblink{0%,100%{opacity:1}50%{opacity:.35}}
body.sdmode .wordcard{border-color:var(--coral);animation:sdpulse 1.1s infinite;}
@keyframes sdpulse{0%,100%{box-shadow:0 0 0 3px var(--coral-bg)}50%{box-shadow:0 0 0 8px var(--coral-bg)}}
body.sdmode .qmeta .badge.re{background:var(--coral-bg);color:var(--coral-dk);}
@media(max-width:480px){.sdtitle{font-size:44px;}}
@media(max-width:480px){.statgrid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div class="wrap">
  <h1>単語バトル <span class="en">EIKEN Pre-2</span></h1>
  <div class="sub">まちがえた単語は少しあとにもう一回出る「くり返し方式」。何日かあけて遊ぶと、忘れかけた単語から優先して出題されます。</div>

  <div id="scr-home">
    <div class="card">
      <label class="fl">だれが遊ぶ?</label>
      <div class="seg" id="selPlayer">
        <button data-v="child" class="on">こども</button>
        <button data-v="parent">おうち</button>
        <button data-v="battle">親子で対戦</button>
      </div>
      <label class="fl">出題はんい</label>
      <div class="seg" id="selCat">
        <button data-v="w" class="on">単語</button>
        <button data-v="j">熟語</button>
        <button data-v="all">ぜんぶ</button>
      </div>
      <label class="fl">モード</label>
      <div class="seg" id="selMode">
        <button data-v="normal" class="on">ふつう(おすすめ)</button>
        <button data-v="weak">にがて特訓</button>
      </div>
      <label class="fl">1ゲームの長さ</label>
      <div class="seg" id="selLen">
        <button data-v="10">クイック 10問</button>
        <button data-v="16" class="on">たっぷり 16問</button>
        <button data-v="20">ガッツリ 20問</button>
      </div>
      <div id="handiBlock">
        <label class="fl">ハンデ(親子で対戦のとき)</label>
        <div class="seg" id="selHandi">
          <button data-v="off" class="on">なし(ガチ勝負)</button>
          <button data-v="on">おうちに8秒制限⏰</button>
        </div>
      </div>
      <div class="ctr" style="margin-top:20px;">
        <button class="primary" id="btnStart" style="font-size:17px;padding:12px 40px;">スタート</button>
      </div>
      <div class="note" id="homeNote"></div>
    </div>
    <div class="card" id="statsCard"></div>
  </div>

  <div id="scr-quiz" class="hidden">
    <div class="scorebar" id="scorebar"></div>
    <div class="itembar" id="itembar" style="display:none;"></div>
    <div class="qmeta">
      <span class="badge" id="qbadge">単語</span>
      <span id="qcount"></span>
    </div>
    <div class="wordcard">
      <div class="word" id="qword">…</div>
      <div class="pos" id="qpos"></div>
      <div id="qmult"></div>
      <div class="boxdots" id="qdots"></div>
      <button class="spk" id="btnSpeak">🔊 もう一回きく</button>
      <div class="timerwrap hidden" id="timerwrap"><i id="timerbar"></i></div>
    </div>
    <div class="miraclebox hidden" id="miraclebox"></div>
    <div class="choices" id="choices"></div>
    <div class="stealbox hidden" id="stealbox"></div>
    <div class="fb" id="fb"></div>
    <div class="ctr">
      <button id="btnNext" class="primary hidden">つぎへ →</button>
      <button id="btnQuit">やめる</button>
    </div>
  </div>

  <div id="scr-result" class="hidden">
    <div class="card"><div class="winner" id="resultBox"></div></div>
    <div class="card" id="reviewBox"></div>
    <div class="ctr" style="margin-top:16px;">
      <button class="primary" id="btnAgain">もう一回あそぶ</button>
      <button id="btnHome">ホームへ</button>
    </div>
  </div>
</div>
<div id="fxlayer" style="position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden;"></div>
<div id="sdfx" class="hidden">
  <div class="sdflash"></div>
  <div class="sdinner">
    <div class="sdround" id="sdroundlbl">ROUND 1</div>
    <div class="sdtitle">SUDDEN<br>DEATH</div>
    <div class="sdjp">─ 決着がつくまで終わらない ─</div>
  </div>
</div>

const POSNAME={v:"動詞",n:"名詞",a:"形容詞",d:"副詞",c:"接続詞・前置詞",j:"熟語"};
const SKEY="eiken-p2-progress-v1";
let progress={child:{},parent:{}};
let memOnly=false;

async function loadProgress(){
  try{
    if(window.storage&&window.storage.get){
      const r=await window.storage.get(SKEY);
      if(r&&r.value)progress=JSON.parse(r.value);
    }else memOnly=true;
  }catch(e){/* キー未作成 or 利用不可 */ if(!(window.storage&&window.storage.get))memOnly=true;}
}
let saveTimer=null;
function saveProgress(){
  if(memOnly)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await window.storage.set(SKEY,JSON.stringify(progress));}catch(e){}
  },400);
}
function meta(){
  if(!progress._m)progress._m={ls:{child:0,parent:0},xp:{child:0,parent:0}};
  if(!progress._m.ls)progress._m.ls={child:0,parent:0};
  if(!progress._m.xp)progress._m.xp={child:0,parent:0};
  return progress._m;
}
function level(xp){return 1+Math.floor(Math.sqrt(xp/60));}
function lvlXp(l){return 60*(l-1)*(l-1);}
const TITLES=[[20,"でんせつの単語王"],[15,"えいごの達人"],[11,"たんごマスター"],[8,"フレーズ使い"],[5,"ワードハンター"],[3,"ことばコレクター"],[1,"たんご見習い"]];
function title(l){for(const[t,n]of TITLES)if(l>=t)return n;return"たんご見習い";}
function rec(pl,key){return progress[pl][key]||null;}
function setRec(pl,key,b){
  const r=progress[pl][key]||{b:0,t:0,w:0};
  if(b<r.b&&r.b>0)r.w=(r.w||0)+1;
  r.b=Math.max(0,Math.min(5,b));r.t=Date.now();
  progress[pl][key]=r;saveProgress();
}
const DAY=86400000;
function weight(pl,item){
  const r=rec(pl,item[0]);
  if(!r)return 5;                       // 未学習を優先
  const age=Date.now()-r.t;
  if(r.b<=1)return 6;                   // にがて最優先
  if(r.b<=3)return age>DAY?4:1;         // 学習中は1日たったら再出題
  return age>3*DAY?2:0.3;               // マスター済みはたまに復習
}

const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickWeighted(pool,pl,n){
  const scored=pool.map(it=>({it,s:weight(pl,it)*(0.5+Math.random())}));
  scored.sort((x,y)=>y.s-x.s);
  return scored.slice(0,n).map(x=>x.it);
}
function speak(text){
  if(!("speechSynthesis"in window))return;
  speechSynthesis.cancel();
  const t=text.replace(/-ing/g,"").replace(/ A /g," ").replace(/ B\b/g,"").replace(/[~〜]/g,"").replace(/\s+/g," ").trim();
  const u=new SpeechSynthesisUtterance(t);
  u.lang="en-US";u.rate=0.85;
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith("en"));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

$("btnStart").onclick=()=>{

  if(sel.mode==="weak"){
    pool=pool.filter(it=>{const r=rec(basePl,it[0]);return r&&r.b<=1;});
    if(pool.length<4){alert("「にがて」の単語がまだ足りません。まずは「ふつう」モードで遊んでね!");return;}

  if(battle){
    const half=Math.ceil(n/2);

    const p=pickWeighted(rest.length>=half?rest:pool,"parent",Math.floor(n/2));
    deck=[];const cs=shuffle(c),ps=shuffle(p);
    for(let i=0;i<half;i++){if(cs[i])deck.push({it:cs[i],re:false});if(ps[i])deck.push({it:ps[i],re:false});}
  }else{
    deck=shuffle(pickWeighted(pool,basePl,n)).map(it=>({it,re:false}));
  }
  deck.forEach(q=>q.m=1);

  if(deck.length>=5){

function animateScore(i,from,to,d){
  const card=$("pc"+i),num=$("sc"+i);
  if(!card||!num)return;
  // 数字ロール(大きい変化ほど長く転がる)
  const dur=Math.min(900,320+Math.abs(d)*7),t0=performance.now();
  num.textContent=from;
  (function tick(now){
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
    num.textContent=Math.round(from+(to-from)*e);
    if(p<1&&num.isConnected)requestAnimationFrame(tick);
  })(t0);
  // 飛び出すポップアップ(±40以上は特大)
  const pop=document.createElement("span");
  pop.className="scorepop "+(d>0?"plus":"minus")+(Math.abs(d)>=40?" big":"");
  pop.textContent=(d>0?"+":"")+d;
  pop.style.right=(10+Math.random()*35)+"px";
  card.appendChild(pop);
  setTimeout(()=>pop.remove(),1200);
  // カードのフラッシュ(+)/シェイク(-)
  card.classList.add(d>0?"gain":"loss");
  // 画面中央のダメージ表示(スクロール位置に関係なく必ず見える)
  const layer=$("fxlayer");
  const fx=document.createElement("div");
  fx.className="fxscore "+(d>0?"plus":"minus")+(Math.abs(d)>=40?" big":"");
  fx.textContent=(battle?PNAME[i]+" ":"")+(d>0?"+":"")+d+"点";
  fx.style.top=(34+layer.childElementCount*9)+"%";
  layer.appendChild(fx);
  setTimeout(()=>fx.remove(),1550);
}

    const thump=t=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";
      o.frequency.setValueAtTime(75,ctx.currentTime+t);
      o.frequency.exponentialRampToValueAtTime(40,ctx.currentTime+t+.16);
      g.gain.setValueAtTime(.55,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.26);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.3);
    };
    thump(0);thump(.32);thump(.85);thump(1.17);   // ドクン…ドクン…
    const o=ctx.createOscillator(),g=ctx.createGain();  // 緊張の上昇音
    o.type="sawtooth";
    o.frequency.setValueAtTime(110,ctx.currentTime+1.55);
    o.frequency.exponentialRampToValueAtTime(720,ctx.currentTime+2.25);
    g.gain.setValueAtTime(.07,ctx.currentTime+1.55);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+2.35);
    o.connect(g).connect(ctx.destination);
    o.start(ctx.currentTime+1.55);o.stop(ctx.currentTime+2.4);
  }catch(e){}
}
const TLIMIT=8000;
function startTimer(ms){
  const LIM=ms||TLIMIT;
  $("timerwrap").classList.remove("hidden");
  const bar=$("timerbar");bar.style.width="100%";bar.className="";
  const t0=Date.now();
  timerId=setInterval(()=>{
    const left=LIM-(Date.now()-t0);
    const pct=Math.max(0,left/LIM*100);
    bar.style.width=pct+"%";
    if(pct<30)bar.classList.add("low");
    if(left<=0){stopTimer();if(!answered)handleWrong(null,deck[qi].it,"⏰ 時間切れ!");}
  },100);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}$("timerwrap").classList.add("hidden");}

function answer(btn,opt,it){
  if(stealing){handleSteal(btn,opt,it);return;}
  if(answered)return;answered=true;stopTimer();
  $("miraclebox").classList.add("hidden");
  if(opt===it[1]){
    revealAnswer(it);
    const pl=curPlayer(),si=battle?turn:0,m=deck[qi].m||1;
    streaks[si]++;
    let picked=null;
    if(battle&&!deck[qi].sd&&floorItem&&!items[si]){picked=floorItem;items[si]=floorItem;floorItem=null;}
    let gotBox=battle&&!deck[qi].sd&&streaks[si]>0&&streaks[si]%2===0&&!items[si]&&!rolling[si];
    let pts,msg;
    if(miracleActive){
      pts=miraclePts;msg=`🌟 ミラクル成功!! +${pts}点で大ぎゃくてん!`;
      if(qTrap==="banana"){pts=Math.ceil(pts/2);msg+=" …だが🍌バナナで半分!";}
    }else{
      pts=10*m;msg=`正解! +${pts}点`+(m>1?`(${m}倍!)`:"");
      if(battle&&!deck[qi].sd){                // おいつきボーナス(負けてる側だけ)
        const gap=RS[1-turn]-RS[turn];
        if(gap>=40){pts+=20;msg+=" & おいつきボーナス +20点!🔥";}
        else if(gap>=20){pts+=10;msg+=" & おいつきボーナス +10点!";}
      }
      if(!deck[qi].sd&&streaks[si]%3===0){pts+=10;msg+=" & 3連続ボーナス +10点!🎉";}
      if(battle&&buffDash[si]){pts+=15;msg+=" & 🍄ダッシュ +15点!";buffDash[si]=false;}
      if(battle&&buffStar[si]){pts*=2;msg+=" & 🌟スターで2倍!";buffStar[si]=false;}
      if(qTrap==="banana"){pts=Math.ceil(pts/2);msg+=" …🍌バナナで半分!";}
    }
    if(picked)msg+=` & 落ちていた${ITEMS[picked].ic}${ITEMS[picked].nm}を拾った!`;
    if(gotBox)msg+=" 🎁アイテムボックスGET!";
    scores[si]+=pts;
    corr[si]++;xpGain[si]+=(deck[qi].sd?20:10)+(miracleActive?30:0);
    const r=rec(pl,it[0]);setRec(pl,it[0],(r?r.b:0)+1);
    $("fb").textContent=msg;$("fb").className="fb ok";
    if(gotBox)rollItem(si);
    advance();
  }else{
    handleWrong(btn,it,"ざんねん!");
  }
}
function handleWrong(btn,it,prefix){
  answered=true;stopTimer();
  $("miraclebox").classList.add("hidden");
  const pl=curPlayer(),si=battle?turn:0;
  streaks[si]=0;
  if(btn){btn.classList.add("ng");btn.disabled=true;}
  setRec(pl,it[0],0);
  if(!missed.has(it[0]))missed.set(it[0],it);
  if(!deck[qi].sd&&!requeued.has(it[0])){   // 少しあとにもう一回出す(記憶の定着)
    requeued.add(it[0]);
    const pos=Math.min(qi+4,deck.length);
    deck.splice(pos,0,{it,re:true,m:1});
  }
  const starred=battle&&buffStar[turn];
  if(battle){buffStar[turn]=false;buffDash[turn]=false;}
  const behind=battle&&RS[1-turn]-RS[turn]>=20;      // ビハインド側(実力スコア20点差以上)はドロップ免除
  if(battle&&!deck[qi].sd&&!starred&&!behind&&items[turn]){   // ミスで持ちアイテムを落とす
    floorItem=items[turn];items[turn]=null;
    prefix+=` 💦${ITEMS[floorItem].ic}を落とした!`;
  }
  const opLeading=battle&&RS[1-turn]>RS[turn];
  if(battle&&!deck[qi].sd&&(!opLeading||stealX>1)&&!starred){
    stealing=true;
    const op=1-turn;
    [...$("choices").children].forEach(b=>{if(!b.classList.contains("ng")){b.disabled=false;b.classList.add("stealable");}});
    $("fb").textContent=prefix;$("fb").className="fb ng";
    $("stealbox").classList.remove("hidden");
    $("stealbox").innerHTML=`⚡ スティールチャンス! ${PNAME[op]}チーム、正解をうばえ!<br><button onclick="passSteal()">パスする</button>`;
    renderScorebar();
  }else{
    revealAnswer(it);
    const note=starred?" 🌟スターがミスを守った!(スティールなし)":((battle&&!deck[qi].sd)?" (リード中はスティールできないよ)":"");
    $("fb").textContent=`${prefix} 正解は「${it[1]}」${note}`;$("fb").className="fb ng";
    advance();
  }
}
function inkify(t){
  const esc=t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const n=t.length;
  if(n<=2)return `<span class="ink">${esc}</span>`;
  const cover=Math.max(2,Math.round(n*0.45));
  const start=1+Math.floor(Math.random()*Math.max(1,n-cover-1));
  return esc.slice(0,start)+'<span class="ink">'+esc.slice(start,start+cover)+'</span>'+esc.slice(start+cover);
}
function revealAnswer(it){
  $("choices").classList.add("deink");   // 正解公開と同時にスミがスーッと消える
  [...$("choices").children].forEach(b=>{b.disabled=true;b.classList.remove("stealable");if(b.textContent===it[1])b.classList.add("ok");});
}
function handleSteal(btn,opt,it){
  stealing=false;
  const op=1-turn,opKey=op===0?"child":"parent",m=deck[qi].m||1;
  revealAnswer(it);
  $("stealbox").classList.add("hidden");
  if(opt===it[1]){
    let pts=10*m*stealX;
    if(battle&&RS[turn]-RS[op]>=20)pts+=10;   // 負けてる側のよこどりは+10
    scores[op]+=pts;stealWins[op]++;xpGain[op]+=15;
    const r=rec(opKey,it[0]);setRec(opKey,it[0],(r?r.b:0)+1);
    $("fb").textContent=`⚡ スティール成功! ${PNAME[op]}チームが +${pts}点よこどり!${stealX>1?"(ミラクル失敗ペナルティ!)":""}`;
    $("fb").className="fb ok";
  }else{
    if(btn)btn.classList.add("ng");
    $("fb").textContent=`スティール失敗… 正解は「${it[1]}」`;
    $("fb").className="fb ng";
  }
  advance();
}
function passSteal(){
  if(!stealing)return;
  stealing=false;
  const it=deck[qi].it;
  revealAnswer(it);
  $("stealbox").classList.add("hidden");
  $("fb").textContent=`正解は「${it[1]}」`;$("fb").className="fb ng";
  advance();
}
function renderItembar(){
  const bar=$("itembar");
  if(!battle){bar.style.display="none";return;}
  bar.style.display="flex";
  const chips=[0,1].map(i=>{
    const it=items[i]?ITEMS[items[i]]:null;
    const sdq=deck[qi]&&deck[qi].sd;
    const canUse=i===turn&&it&&!answered&&!stealing&&!rolling[i]&&!sdq&&!miracleActive;
    const buffs=(buffDash[i]?" 🍄発動中":"")+(buffStar[i]?" 🌟発動中":"");
    return `<div class="ichip ${i===turn?"on":""}" id="ichip${i}">
      <span class="iic">${rolling[i]?"❓":(it?it.ic:"➖")}</span>
      <span class="ids"><b>${PNAME[i]}</b> ${rolling[i]?"🎁 ルーレット中…":(it?it.nm+"「"+it.ds+"」":"アイテムなし")}${buffs}</span>
      ${canUse?`<button onclick="useItem(${i})">つかう!</button>`:""}
    </div>`;});
  const floorChip=floorItem?`<div class="ichip" style="flex:0 0 auto;border-style:solid;border-color:var(--blue);background:var(--blue-bg);color:var(--blue-dk);"><span class="iic">${ITEMS[floorItem].ic}</span><span class="ids"><b>落ちてる!</b><br>次に正解した人がGET</span></div>`:"";
  bar.innerHTML=chips[0]+floorChip+chips[1];
}
function rollItem(si){
  rolling[si]=true;renderItembar();
  const g=RS[1-si]-RS[si];   // 負けてる側ほど強いアイテム(マリカ方式)
  let table=g>=40?[["mush",8],["green",8],["banana",12],["squid",16],["thunder",15],["red",20],["star",21]]
           :g>=15?[["mush",13],["green",14],["banana",15],["squid",17],["thunder",15],["red",15],["star",11]]
                 :[["mush",20],["green",20],["banana",17],["squid",15],["thunder",12],["red",9],["star",4]];
  table=table.map(([k,w])=>[k,k===lastItem[si]?Math.max(1,Math.ceil(w*0.25)):w]);   // 直前と同じアイテムは出にくく
  const tot=table.reduce((a,b)=>a+b[1],0);
  let r=Math.random()*tot,pick=table[0][0];
  for(const[k,w]of table){if((r-=w)<0){pick=k;break;}}
  const icons=Object.values(ITEMS).map(x=>x.ic);let n=0;
  const iv=setInterval(()=>{n++;const el=$("ichip"+si);if(el)el.querySelector(".iic").textContent=icons[n%icons.length];},90);
  setTimeout(()=>{clearInterval(iv);rolling[si]=false;items[si]=pick;lastItem[si]=pick;renderItembar();},1200);
}
function useItem(i){
  const sdq=deck[qi]&&deck[qi].sd;
  if(i!==turn||!items[i]||answered||stealing||rolling[i]||sdq||miracleActive)return;
  const k=items[i];items[i]=null;
  const op=1-i;
  if(k==="mush"){buffDash[i]=true;fbmsg(`🍄 ダッシュキノコ! この問題の正解に +15点!`);}
  else if(k==="star"){buffStar[i]=true;fbmsg(`🌟 スター発動! この問題は得点2倍&ミスしても盗まれない!`);}
  else if(k==="green"){scores[op]=Math.max(0,scores[op]-10);const b=streaks[op]>0;streaks[op]=0;fbmsg(`🐢 ミドリこうらが命中! ${PNAME[op]}チーム -10点${b?" & 連続記録ストップ":""}!`);}
  else if(k==="red"){scores[op]=Math.max(0,scores[op]-25);const b=streaks[op]>0;streaks[op]=0;fbmsg(`🎯 アカこうらが命中!! ${PNAME[op]}チーム -25点${b?" & 連続記録ストップ":""}!`);}
  else if(k==="banana"){trap[op]="banana";fbmsg(`🍌 バナナを相手の道にしかけた…(相手の次の問題の得点が半分に)`);}
  else if(k==="squid"){trap[op]="ink";fbmsg(`🦑 ゲッソーを放った! 相手の次の問題はスミまみれ!`);}
  else if(k==="thunder"){trap[op]="thunder";fbmsg(`⚡ サンダーを相手にしかけた…(相手の次の問題は5秒制限!)`);}
  xpGain[i]+=5;
  renderScorebar();
}
function fbmsg(t){$("fb").textContent=t;$("fb").className="fb ok";}
function useMiracle(){
  if(!battle||miracle[turn]||answered||stealing)return;
  miracle[turn]=true;miracleActive=true;
  miraclePts=(scores[1-turn]-scores[turn])+20;
  stealX=2;
  $("miraclebox").classList.add("hidden");
  $("qmult").innerHTML=`<span class="multbadge final">🌟 ミラクル発動中! 正解で +${miraclePts}点!</span>`;
}
function advance(){
  miracleActive=false;stealX=1;
  renderScorebar();
  if(qi<deck.length-1)$("btnNext").classList.remove("hidden");
  else if(battle&&scores[0]===scores[1])startSudden();
  else finish();
}
function startSudden(){
  sdRound++;
  const used=new Set(deck.map(q=>q.it[0]));
  const pool=catPool().filter(x=>!used.has(x[0]));
  const rand=()=>W[Math.floor(Math.random()*W.length)];
  const k1=(1-turn)===0?"child":"parent";   // 次に答える人
  const k2=turn===0?"child":"parent";
  const p1=pickWeighted(pool,k1,1)[0]||pool[0]||rand();
  const pool2=pool.filter(x=>x!==p1);
  const p2=pickWeighted(pool2,k2,1)[0]||pool2[0]||rand();
  deck.push({it:p1,re:false,m:1,sd:true},{it:p2,re:false,m:1,sd:true});
  $("sdroundlbl").textContent="ROUND "+sdRound;
  $("sdfx").classList.remove("hidden");
  sdSound();
  setTimeout(()=>{
    $("sdfx").classList.add("hidden");
    qi++;turn=1-turn;renderScorebar();showQ();   // 演出明けに自動で1問目へ
  },2700);
}
$("btnNext").onclick=()=>{qi++;if(battle)turn=1-turn;renderScorebar();showQ();};
$("btnQuit").onclick=()=>{document.body.classList.remove("sdmode");$("sdfx").classList.add("hidden");stopTimer();speechSynthesis.cancel&&speechSynthesis.cancel();$("scr-quiz").classList.add("hidden");$("scr-home").classList.remove("hidden");renderStats();};

function finish(){
  document.body.classList.remove("sdmode");
  const M=meta();
  const keys=battle?["child","parent"]:[sel.player];
  const oldLv=keys.map(k=>level(M.xp[k]||0));
  if(battle){
    const wk=scores[0]>scores[1]?"child":"parent";
    const lk=wk==="child"?"parent":"child";
    M.ls[wk]=0;M.ls[lk]=(M.ls[lk]||0)+1;
  }
  keys.forEach((k,i)=>{M.xp[k]=(M.xp[k]||0)+xpGain[i];});
  const newLv=keys.map(k=>level(M.xp[k]||0));
  saveProgress();
  $("scr-quiz").classList.add("hidden");$("scr-result").classList.remove("hidden");
  let head;
  if(battle){
    const w=scores[0]>scores[1]?"こどもチームの勝ち!🏆":scores[1]>scores[0]?"おうちチームの勝ち!🏆":"引き分け!🤝";
    head=`<div class="t">${w}</div><div class="d">こども ${scores[0]}点 / おうち ${scores[1]}点</div>`;
    if(stealWins[0]||stealWins[1])head+=`<div class="d">⚡ スティール成功: こども${stealWins[0]}回 / おうち${stealWins[1]}回</div>`;
    if(sdRound)head+=`<div class="d">🔥 サドンデス${sdRound}ラウンドの死闘!</div>`;
    head+=`<div class="d">🌱 けいけんち: こども +${xpGain[0]}XP / おうち +${xpGain[1]}XP</div>`;
    const li=scores[0]>scores[1]?1:0;
    const margin=Math.abs(scores[0]-scores[1]);
    head+=`<div class="d" style="margin-top:6px;">${PNAME[li]}チームも${corr[li]}問正解で着実にレベルアップ中!${margin<=20?" あと一歩だった…!!":""}</div>`;
  }else{
    head=`<div class="t">おつかれさま!🎉</div><div class="d">スコア ${scores[0]}点 / 🌱 +${xpGain[0]}XP</div>`;
  }
  keys.forEach((k,i)=>{
    if(newLv[i]>oldLv[i])head+=`<div class="d" style="color:var(--amber-dk);font-weight:700;margin-top:6px;">🎉 ${battle?PNAME[i]+"が":""}Lv.${newLv[i]}「${title(newLv[i])}」にレベルアップ!</div>`;
  });
  $("resultBox").innerHTML=head;
  let html="";
  if(missed.size){
    html+=`<b style="font-size:15px;">📖 今日まちがえた単語(${missed.size}語)</b>
    <div class="note" style="margin:2px 0 6px;">次に遊ぶとき、この単語が優先して出てきます。声に出して読んでみよう。</div>`;
    missed.forEach(it=>{
      html+=`<div class="rvrow"><b>${it[0]}</b><span>${it[1]}</span><button class="sbtn" onclick="speak('${it[0].replace(/'/g,"\\'")}')">🔊</button></div>`;
    });
  }else{
    html+=`<div style="text-align:center;color:var(--green-dk);font-weight:700;">⭐ 全問正解! 復習する単語はありません</div>`;
  }
  $("reviewBox").innerHTML=html;
}
$("btnAgain").onclick=()=>{$("scr-result").classList.add("hidden");$("btnStart").click();};
$("btnHome").onclick=()=>{$("scr-result").classList.add("hidden");$("scr-home").classList.remove("hidden");renderStats();};

loadProgress().then(renderStats);
</script>
