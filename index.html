<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<title>英検準2級 単語バトル</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F4; --card:#FFFFFF; --ink:#26323C; --sub:#6B7A85; --line:#E4E2D8;
  --green:#149A6B; --green-bg:#E3F5EC; --green-dk:#0A6B49;
  --coral:#E15A3C; --coral-bg:#FCEAE4; --coral-dk:#9C3A22;
  --blue:#2E7CC4; --blue-bg:#E7F1FA; --blue-dk:#1A517F;
  --amber:#F0A31F; --amber-bg:#FCF1D8; --amber-dk:#8A5B08;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",sans-serif;line-height:1.6;min-height:100vh;}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px;}
h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;}
h1 .en{font-family:"Outfit",sans-serif;font-size:13px;font-weight:600;color:var(--green);background:var(--green-bg);padding:2px 10px;border-radius:99px;}
.sub{font-size:13px;color:var(--sub);margin-top:2px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:14px;}
button{font-family:inherit;font-size:15px;font-weight:500;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;cursor:pointer;transition:transform .06s,background .15s,border-color .15s;}
button:hover{border-color:var(--ink);}
button:active{transform:scale(.97);}
button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:700;}
button.primary:hover{background:var(--green-dk);border-color:var(--green-dk);}
.seg{display:flex;gap:8px;flex-wrap:wrap;}
.seg button{flex:1;min-width:100px;}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
label.fl{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 6px;}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.stat{background:var(--bg);border-radius:10px;padding:8px 6px;text-align:center;}
.stat b{display:block;font-size:20px;font-weight:700;}
.stat span{font-size:11px;color:var(--sub);}
.pbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px;}
.pbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s;}
.scorebar{display:flex;gap:10px;margin-top:14px;}
.pcard{flex:1;border-radius:var(--radius);padding:10px 14px;border:2px solid transparent;background:var(--card);border-color:var(--line);transition:all .2s;}
.pcard.active{border-color:var(--green);background:var(--green-bg);}
.pcard .nm{font-size:12px;color:var(--sub);font-weight:700;}
.pcard.active .nm{color:var(--green-dk);}
.pcard .sc{font-size:24px;font-weight:700;font-family:"Outfit",sans-serif;}
.pcard .st{font-size:11px;color:var(--amber-dk);font-weight:700;}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px;color:var(--sub);}
.qmeta .badge{background:var(--blue-bg);color:var(--blue-dk);font-weight:700;padding:1px 10px;border-radius:99px;font-size:12px;}
.qmeta .badge.re{background:var(--amber-bg);color:var(--amber-dk);}
.wordcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 18px 18px;text-align:center;margin-top:8px;}
.word{font-family:"Outfit",sans-serif;font-size:36px;font-weight:700;letter-spacing:.01em;line-height:1.2;}
.word.small{font-size:26px;}
.pos{font-size:12px;color:var(--sub);margin-top:4px;}
.boxdots{margin-top:10px;font-size:0;}
.boxdots i{display:inline-block;width:9px;height:9px;border-radius:99px;background:var(--line);margin:0 3px;}
.boxdots i.f{background:var(--green);}
.spk{margin-top:12px;font-size:14px;padding:8px 18px;border-radius:99px;}
.choices{display:grid;gap:10px;margin-top:14px;}
.choices button{text-align:left;font-size:16px;padding:13px 16px;}
.choices button.ok{background:var(--green-bg);border-color:var(--green);color:var(--green-dk);font-weight:700;}
.choices button.ng{background:var(--coral-bg);border-color:var(--coral);color:var(--coral-dk);font-weight:700;}
.choices button:disabled{cursor:default;}
.fb{min-height:30px;text-align:center;font-size:15px;font-weight:700;margin-top:12px;}
.fb.ok{color:var(--green-dk);}
.fb.ng{color:var(--coral-dk);}
.ctr{display:flex;justify-content:center;gap:10px;margin-top:10px;}
.rvrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px;}
.rvrow b{font-family:"Outfit",sans-serif;font-weight:600;}
.rvrow span{color:var(--sub);text-align:right;}
.rvrow .sbtn{font-size:12px;padding:3px 10px;border-radius:99px;flex-shrink:0;}
.hidden{display:none;}
.winner{text-align:center;padding:8px 0 4px;}
.winner .t{font-size:22px;font-weight:700;}
.winner .d{font-size:14px;color:var(--sub);}
.note{font-size:12px;color:var(--sub);margin-top:10px;}
.footer-note{font-size:11px;color:var(--sub);margin-top:24px;text-align:center;}
.multbadge{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;padding:3px 16px;border-radius:99px;background:var(--amber-bg);color:var(--amber-dk);animation:pulse 1.1s infinite;}
.multbadge.final{background:var(--coral-bg);color:var(--coral-dk);}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.timerwrap{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px;}
.timerwrap i{display:block;height:100%;width:100%;background:var(--blue);border-radius:99px;}
.timerwrap i.low{background:var(--coral);}
.stealbox{background:var(--amber-bg);border:2px dashed var(--amber);border-radius:var(--radius);padding:10px 14px;margin-top:12px;text-align:center;font-weight:700;color:var(--amber-dk);animation:pulse 1.1s infinite;}
.stealbox button{margin-top:6px;font-size:13px;padding:5px 16px;border-radius:99px;background:#fff;}
.choices button.stealable{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-bg);}
.choices .ink{background:#232B36;color:transparent;border-radius:7px;padding:0 1px;}
.choices.deink .ink{background:transparent;color:inherit;transition:background .5s ease,color .5s ease;}
.scorebar{position:sticky;top:0;z-index:50;background:var(--bg);padding:8px 0 6px;box-shadow:0 6px 12px -8px rgba(38,50,60,.18);}
.pcard{position:relative;}
.scorepop{position:absolute;top:-8px;font-family:"Outfit",sans-serif;font-weight:700;font-size:20px;pointer-events:none;z-index:5;animation:popup 1.15s ease-out forwards;}
.scorepop.plus{color:var(--green-dk);text-shadow:0 0 12px rgba(20,154,107,.35);}
.scorepop.minus{color:var(--coral-dk);text-shadow:0 0 12px rgba(225,90,60,.35);}
.scorepop.big{font-size:32px;}
@keyframes popup{0%{transform:translateY(8px) scale(.5);opacity:0}14%{transform:translateY(0) scale(1.35);opacity:1}30%{transform:scale(1)}100%{transform:translateY(-40px) scale(1);opacity:0}}
.pcard.gain{animation:cardgain .55s ease-out;}
@keyframes cardgain{0%{box-shadow:0 0 0 0 rgba(20,154,107,.55)}100%{box-shadow:0 0 0 16px rgba(20,154,107,0)}}
.pcard.loss{animation:cardloss .5s ease-out;}
@keyframes cardloss{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px);box-shadow:0 0 0 4px var(--coral-bg)}35%{transform:translateX(6px)}55%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fxscore{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:"M PLUS Rounded 1c",sans-serif;font-weight:700;font-size:30px;white-space:nowrap;animation:fxslam 1.5s cubic-bezier(.2,1.3,.4,1) forwards;text-shadow:0 2px 0 #fff,0 4px 14px rgba(38,50,60,.25);}
.fxscore.plus{color:var(--green-dk);}
.fxscore.minus{color:var(--coral-dk);}
.fxscore.big{font-size:44px;}
@keyframes fxslam{0%{transform:translateX(-50%) scale(2.4);opacity:0}12%{transform:translateX(-50%) scale(1);opacity:1}55%{transform:translateX(-50%) translateY(0);opacity:1}100%{transform:translateX(-50%) translateY(-70px);opacity:0}}
.itembar{display:flex;gap:10px;margin-top:10px;}
.ichip{flex:1;display:flex;align-items:center;gap:7px;background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:6px 10px;font-size:12px;color:var(--sub);min-height:40px;}
.ichip.on{border-color:var(--amber);background:var(--amber-bg);}
.ichip .iic{font-size:20px;line-height:1;}
.ichip .ids{flex:1;line-height:1.3;}
.ichip button{font-size:12px;padding:4px 14px;border-radius:99px;background:var(--amber);border-color:var(--amber);color:#fff;font-weight:700;animation:pulse 1.1s infinite;}
.miraclebox{background:linear-gradient(135deg,var(--amber-bg),var(--coral-bg));border:2px solid var(--amber);border-radius:var(--radius);padding:12px 14px;margin-top:12px;text-align:center;font-size:14px;}
.miraclebox .mnote{font-size:12px;color:var(--sub);}
.miraclebox button{margin-top:8px;font-weight:700;background:var(--amber);border-color:var(--amber);color:#fff;font-size:15px;padding:9px 26px;animation:pulse 1.1s infinite;}
#sdfx{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#3a0d0d,#120404 75%);}
#sdfx.hidden{display:none;}
.sdflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:sdflash 1.3s .05s;}
@keyframes sdflash{0%{opacity:.95}7%{opacity:0}11%{opacity:.55}18%{opacity:0}26%{opacity:.25}32%{opacity:0}100%{opacity:0}}
.sdinner{text-align:center;color:#fff;animation:sdslam .55s cubic-bezier(.2,1.5,.35,1),sdquake .07s 10 alternate .6s;}
@keyframes sdslam{0%{transform:scale(3.2);opacity:0}55%{transform:scale(.93);opacity:1}100%{transform:scale(1)}}
@keyframes sdquake{from{transform:translate(-3px,1px)}to{transform:translate(3px,-1px)}}
.sdround{font-family:"Outfit",sans-serif;font-size:17px;font-weight:600;letter-spacing:.35em;color:#F0A31F;}
.sdtitle{font-family:"Outfit",sans-serif;font-size:62px;font-weight:700;line-height:.95;letter-spacing:.03em;color:#FF4D4D;text-shadow:0 0 24px rgba(255,77,77,.65),0 0 60px rgba(255,77,77,.35);margin-top:8px;}
.sdjp{margin-top:16px;font-size:15px;color:#ffd6d6;letter-spacing:.1em;animation:sdblink 1s infinite .7s;}
@keyframes sdblink{0%,100%{opacity:1}50%{opacity:.35}}
body.sdmode .wordcard{border-color:var(--coral);animation:sdpulse 1.1s infinite;}
@keyframes sdpulse{0%,100%{box-shadow:0 0 0 3px var(--coral-bg)}50%{box-shadow:0 0 0 8px var(--coral-bg)}}
body.sdmode .qmeta .badge.re{background:var(--coral-bg);color:var(--coral-dk);}
@media(max-width:480px){.sdtitle{font-size:44px;}}
@media(max-width:480px){.statgrid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div class="wrap">
  <h1>単語バトル <span class="en">EIKEN Pre-2</span></h1>
  <div class="sub">まちがえた単語は少しあとにもう一回出る「くり返し方式」。何日かあけて遊ぶと、忘れかけた単語から優先して出題されます。</div>

  <div id="scr-home">
    <div class="card">
      <label class="fl">だれが遊ぶ?</label>
      <div class="seg" id="selPlayer">
        <button data-v="child" class="on">こども</button>
        <button data-v="parent">おうち</button>
        <button data-v="battle">親子で対戦</button>
      </div>
      <label class="fl">出題はんい</label>
      <div class="seg" id="selCat">
        <button data-v="w" class="on">単語</button>
        <button data-v="j">熟語</button>
        <button data-v="all">ぜんぶ</button>
      </div>
      <label class="fl">モード</label>
      <div class="seg" id="selMode">
        <button data-v="normal" class="on">ふつう(おすすめ)</button>
        <button data-v="weak">にがて特訓</button>
      </div>
      <label class="fl">1ゲームの長さ</label>
      <div class="seg" id="selLen">
        <button data-v="10">クイック 10問</button>
        <button data-v="16" class="on">たっぷり 16問</button>
        <button data-v="20">ガッツリ 20問</button>
      </div>
      <div id="handiBlock">
        <label class="fl">ハンデ(親子で対戦のとき)</label>
        <div class="seg" id="selHandi">
          <button data-v="off" class="on">なし(ガチ勝負)</button>
          <button data-v="on">おうちに8秒制限⏰</button>
        </div>
      </div>
      <div class="ctr" style="margin-top:20px;">
        <button class="primary" id="btnStart" style="font-size:17px;padding:12px 40px;">スタート</button>
      </div>
      <div class="note" id="homeNote"></div>
    </div>
    <div class="card" id="statsCard"></div>
  </div>

  <div id="scr-quiz" class="hidden">
    <div class="scorebar" id="scorebar"></div>
    <div class="itembar" id="itembar" style="display:none;"></div>
    <div class="qmeta">
      <span class="badge" id="qbadge">単語</span>
      <span id="qcount"></span>
    </div>
    <div class="wordcard">
      <div class="word" id="qword">…</div>
      <div class="pos" id="qpos"></div>
      <div id="qmult"></div>
      <div class="boxdots" id="qdots"></div>
      <button class="spk" id="btnSpeak">🔊 もう一回きく</button>
      <div class="timerwrap hidden" id="timerwrap"><i id="timerbar"></i></div>
    </div>
    <div class="miraclebox hidden" id="miraclebox"></div>
    <div class="choices" id="choices"></div>
    <div class="stealbox hidden" id="stealbox"></div>
    <div class="fb" id="fb"></div>
    <div class="ctr">
      <button id="btnNext" class="primary hidden">つぎへ →</button>
      <button id="btnQuit">やめる</button>
    </div>
  </div>

  <div id="scr-result" class="hidden">
    <div class="card"><div class="winner" id="resultBox"></div></div>
    <div class="card" id="reviewBox"></div>
    <div class="ctr" style="margin-top:16px;">
      <button class="primary" id="btnAgain">もう一回あそぶ</button>
      <button id="btnHome">ホームへ</button>
    </div>
  </div>
  <p class="footer-note">
    本アプリは実用英語技能検定 準2級レベルの学習を想定した非公式の学習教材です。
    日本英語検定協会とは関係ありません。単語リストは公開語彙資料等を参考に独自編集しています。
  </p>
</div>
<div id="fxlayer" style="position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden;"></div>
<div id="sdfx" class="hidden">
  <div class="sdflash"></div>
  <div class="sdinner">
    <div class="sdround" id="sdroundlbl">ROUND 1</div>
    <div class="sdtitle">SUDDEN<br>DEATH</div>
    <div class="sdjp">─ 決着がつくまで終わらない ─</div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
<script src="js/pwa-register.js"></script>
</body>
</html>
